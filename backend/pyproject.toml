[project]
name = "modernization-factory"
version = "0.1.0"
description = "Agentic software delivery and modernization factory"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
live = ["openai>=1.50", "anthropic>=0.40", "langgraph>=0.2", "langchain-core>=0.3"]
db = ["psycopg[binary]>=3.2", "sqlalchemy>=2.0", "alembic>=1.13"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP042"]  # line length handled by formatter; StrEnum needs py3.11+ everywhere

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
